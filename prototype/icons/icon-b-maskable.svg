<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Option B · white weight plate with a cut-out "G", on a subtle barbell. -->
  <rect width="1024" height="1024" fill="#0B0B0C"/>
  <g transform="translate(512 512) scale(.78) translate(-512 -512)">
  <!-- bar + collars (quiet grey so the plate leads) -->
  <rect x="64" y="486" width="896" height="52" rx="26" fill="#3A3A40"/>
  <rect x="150" y="440" width="44" height="144" rx="14" fill="#55555C"/>
  <rect x="830" y="440" width="44" height="144" rx="14" fill="#55555C"/>
  <!-- plate -->
  <circle cx="512" cy="512" r="290" fill="#FFFFFF"/>
  <circle cx="512" cy="512" r="254" fill="none" stroke="#0B0B0C" stroke-opacity=".12" stroke-width="6"/>
  <!-- G cut-out -->
  <path d="M596.3 418.4 A126 126 0 1 0 611.3 589.6 L611.3 512 L536 512" fill="none" stroke="#0B0B0C" stroke-width="78" stroke-linejoin="miter"/>
</g>
</svg>
