name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: gymbro
          POSTGRES_PASSWORD: gymbro
          POSTGRES_DB: gymbro
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymbro -d gymbro"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        run: dotnet test GymBro.slnx --configuration Release

      - name: Frontend typecheck, test, and build
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Install Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      # Three e2e tests insert a past weigh-in with psql. The runner image does not ship it.
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: End-to-end smoke
        working-directory: frontend
        run: npm run e2e

      # retro.config.ts binds the same 8100 and 5173 ports as the smoke config.
      # Keep this step after the smoke step so the two never run together.
      - name: Retro accessibility
        working-directory: frontend
        run: npx playwright test --config e2e/retro.config.ts

      - name: Docker image
        run: docker build -t gymbro:ci .

  prototype:
    name: prototype
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: prototype/package-lock.json

      - name: Prototype build
        working-directory: prototype
        run: npm ci && npm run build && node scripts/unit-trend.mjs
