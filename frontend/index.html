<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#16181D" />
    <script>
      (function () {
        var allowed = { graphite: "#16181D", midnight: "#121826", charcoal: "#1A1816", black: "#000000" };
        var stored = "";
        try { stored = localStorage.getItem("gymbro-theme") || ""; } catch (e) { stored = ""; }
        var theme = Object.prototype.hasOwnProperty.call(allowed, stored) ? stored : "graphite";
        document.documentElement.dataset.theme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", allowed[theme]);
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!--
      default, not black-translucent. On iOS 26+ a translucent status bar lays the
      system blur over the top of the page (and a row or two below it) and shortens
      the layout viewport by the status-bar inset, which paints a dead band under
      the tab bar. default keeps an opaque bar tinted by theme-color, and the page
      starts below it. iOS caches this with the Home Screen icon: delete the icon
      and add it again before the change shows up.
    -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Gym Bro</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
